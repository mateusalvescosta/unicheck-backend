# Copie este arquivo para application-local.properties, preencha os tres valores
# marcados e execute UnicheckApplication normalmente pelo Run do IntelliJ.
# Variaveis de ambiente com os nomes indicados continuam tendo precedencia.

# Le o .env da raiz do projeto, se existir (modelo em .env.exemplo). As chaves dele preenchem
# os ${...} abaixo; variaveis de ambiente reais do sistema continuam tendo precedencia sobre o .env.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unicheck_db}
spring.datasource.username=${DB_USERNAME:PREENCHA_USUARIO_POSTGRES}
spring.datasource.password=${DB_PASSWORD:PREENCHA_SENHA_POSTGRES}

security.jwt.secret=${JWT_SECRET:PREENCHA_COM_SEGREDO_ALEATORIO_DE_32_BYTES_OU_MAIS}
security.jwt.issuer=${JWT_ISSUER:https://unicheck.local}

# E-mail: sem as variaveis MAIL_*, os padroes apontam para o Mailpit (SMTP 1025, interface em
# http://localhost:8025). Para enviar pelo Resend, preencha as variaveis MAIL_* no .env.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

app.mail.remetente=${MAIL_REMETENTE:nao-responder@unicheck.local}
app.recuperacao-senha.validade-minutos=30
app.recuperacao-senha.limite-por-hora=3
app.recuperacao-senha.url-frontend=${RECUPERACAO_SENHA_URL_FRONTEND:http://localhost:3000/redefinir-senha}
