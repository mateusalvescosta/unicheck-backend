# Copie este arquivo para application-local.properties, preencha os tres valores
# marcados e execute UnicheckApplication normalmente pelo Run do IntelliJ.
# Variaveis de ambiente com os nomes indicados continuam tendo precedencia.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unicheck_db}
spring.datasource.username=${DB_USERNAME:PREENCHA_USUARIO_POSTGRES}
spring.datasource.password=${DB_PASSWORD:PREENCHA_SENHA_POSTGRES}

security.jwt.secret=${JWT_SECRET:PREENCHA_COM_SEGREDO_ALEATORIO_DE_32_BYTES_OU_MAIS}
security.jwt.issuer=${JWT_ISSUER:https://unicheck.local}
